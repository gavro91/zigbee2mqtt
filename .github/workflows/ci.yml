name: CI

on:
  push:
    branches:
      - master
      - dev
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - dev

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: latest
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Log in to Docker Hub
        if: (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')) && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: koenkk
          password: ${{ secrets.DOCKER_KEY }}

      - name: Log in to the GitHub container registry
        if: (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')) && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: koenkk
          password: ${{ secrets.GH_TOKEN }}

      - name: Docker setup - QEMU
        if: (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')) && github.event_name == 'push'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Docker setup - Buildx
        if: (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/')) && github.event_name == 'push'
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: latest

      - name: dev - Docker build and push
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64/v8,linux/amd64,linux/arm/v6,linux/arm/v7,linux/riscv64,linux/386
          tags: koenkk/zigbee2mqtt:latest-dev,ghcr.io/koenkk/zigbee2mqtt:latest-dev
          push: true
          build-args: |
            COMMIT=${{ github.sha }}
            VERSION=dev
            DATE=${{ github.event.repository.updated_at }}

      - name: dev - Publish types
        if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
        run: |
          pnpm run build:types
          temp_dir=$(mktemp -d)
          cp -R package.json LICENSE dist $temp_dir
          git fetch --unshallow
          git checkout dev-types
          rm -rf *
          cp -R $temp_dir/* .
          # remove unnecessary dependencies
          KEEP_DEPS='["zigbee-herdsman","zigbee-herdsman-converters"]'
          tmp_pkg=$(mktemp)
          jq --indent 4 --argjson keep "$KEEP_DEPS" 'def filterDeps: (. // {}) | with_entries(select(.key as $k | $keep | index($k))); .dependencies |= filterDeps | .devDependencies |= filterDeps | .optionalDependencies |= filterDeps' package.json > "$tmp_pkg"
          mv "$tmp_pkg" package.json
          git add -A
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "$GITHUB_SHA" || echo 'Nothing to commit'
          git push --force --set-upstream origin dev-types

      - name: release - Docker meta
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: |
            koenkk/zigbee2mqtt
            ghcr.io/koenkk/zigbee2mqtt
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
